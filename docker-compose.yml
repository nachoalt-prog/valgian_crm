services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: valgian
      POSTGRES_PASSWORD: valgian
      POSTGRES_DB: valgian_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valgian -d valgian_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
